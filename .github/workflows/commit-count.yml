name: all-time commit count

on:
  schedule:
    - cron: "30 6 * * *"    # daily ~02:30 US Eastern (staggered after 3d/trophy/snake)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Count all-time commits and write the shields endpoint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh api -H "Accept: application/vnd.github.cloak-preview" \
                "/search/commits?q=author:${{ github.repository_owner }}&per_page=1" --jq '.total_count')
          case "$n" in ''|*[!0-9]*) echo "invalid count: '$n'"; exit 1;; esac
          pretty=$(printf '%s' "$n" | sed ':a;s/\B[0-9]\{3\}\>/,&/;ta')   # thousands separators
          mkdir -p stats
          printf '{"schemaVersion":1,"label":"commits (all-time)","message":"%s","color":"f59e0b"}\n' "$pretty" > stats/commits.json
          cat stats/commits.json
          git config user.name  github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats/commits.json
          git commit -m "chore: refresh all-time commit count ($pretty)" || exit 0
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            echo "push attempt $attempt failed; retrying in $((attempt * 5))s"; sleep $((attempt * 5))
          done
          echo "ERROR: failed to push after 3 attempts"; exit 1
