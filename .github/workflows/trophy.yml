name: Update profile trophy

on:
  schedule:
    - cron: "15 6 * * *"    # daily ~02:15 US Eastern (staggered from the 3D job to avoid a push race)
  workflow_dispatch:         # lets you trigger the first run manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate trophy.svg
        uses: soulteary/github-profile-trophy-action@cabefc1ce203b1ce4c03dae3335aa794aefbbb80 # v1.0.0
        with:
          # Solid light card background (no `no-bg`) so the label text stays readable on GitHub's dark theme too.
          options: 'username=${{ github.repository_owner }}&theme=flat&column=8&margin-w=10&margin-h=10'
          path: assets/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v1.0.0
      - name: Commit trophy.svg
        run: |
          git config user.name  github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Validate before committing — never ship a blank/broken SVG silently.
          test -s assets/trophy.svg && grep -q '<svg' assets/trophy.svg || { echo "invalid SVG"; exit 1; }
          git add assets/trophy.svg
          git commit -m "chore: refresh profile trophy" || exit 0
          # Push with rebase + bounded retry (resolves the concurrent-push race; fails loud if persistent).
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then exit 0; fi
            echo "push attempt $attempt failed; retrying in $((attempt * 5))s"; sleep $((attempt * 5))
          done
          echo "ERROR: failed to push after 3 attempts"; exit 1
