<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 556" width="800" height="556"><title>In revision · Water Resources Research. FLOODABM: what do household flood choices cost over time? A coupled household and flood-catastrophe model that follows each choice through to flood damage, insurance payouts and out-of-pocket cost. The households here are rule-based agents, not LLM. My part: Designed and fielded the household survey (Passaic River Basin, NJ); Built the pipeline that turns survey answers into agent parameters; Built the coupled model, with NFIP premium, payout and deductible rules; First author.</title><style>text{font-family:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}.fillc{fill:currentColor;stroke:none}</style><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13444d"/><stop offset=".75" stop-color="#0b2026"/></linearGradient></defs><rect width="800" height="556" rx="28" fill="#8de4e6"/><g opacity=".1"><g transform="translate(580 346) scale(4.791666666666667)" style="color:#06282c" fill="none" stroke="#06282c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25 24 11l15 14M14 21v12M34 21v12M21 33v-7h6v7"/><path d="M3 38c4-3 6.500-3 10.500 0s6.500 3 10.500 0 6.500-3 10.500 0 6.500 3 10.500 0M3 44c4-3 6.500-3 10.500 0s6.500 3 10.500 0 6.500-3 10.500 0 6.500 3 10.500 0"/></g></g><rect x="32" y="34" width="429" height="38" rx="19" fill="none" stroke="#06282c" stroke-opacity=".28"/><text x="47" y="59" class="m" font-size="17.5" fill="#06282c">In revision · Water Resources Research</text><text x="32" y="118" font-size="31" font-weight="600" letter-spacing="-1" fill="#06282c">FLOODABM: what do household flood</text><text x="32" y="155" font-size="31" font-weight="600" letter-spacing="-1" fill="#06282c">choices cost over time?</text><text x="32" y="196" font-size="20" fill="#06282c">A coupled household and flood-catastrophe model that follows each</text><text x="32" y="224" font-size="20" fill="#06282c">choice through to flood damage, insurance payouts and out-of-pocket</text><text x="32" y="252" font-size="20" fill="#06282c">cost. The households here are rule-based agents, not LLM.</text><text x="32" y="302" class="m" font-size="17" letter-spacing="1.6" fill="#2a5b60">MY PART</text><circle cx="39" cy="327" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="334" font-size="19.5" fill="#06282c">Designed and fielded the household survey (Passaic River Basin, NJ)</text><circle cx="39" cy="362" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="369" font-size="19.5" fill="#06282c">Built the pipeline that turns survey answers into agent parameters</text><circle cx="39" cy="397" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="404" font-size="19.5" fill="#06282c">Built the coupled model, with NFIP premium, payout and deductible</text><text x="56" y="431" font-size="19.5" fill="#06282c">rules</text><circle cx="39" cy="459" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="466" font-size="19.5" fill="#06282c">First author</text><text x="768" y="528" text-anchor="end" font-size="20" font-weight="600" fill="#06282c">Read the case ↗</text></svg>