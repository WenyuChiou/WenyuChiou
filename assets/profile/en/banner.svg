<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420"><title>Wenyu Chiou. I study how people decide under flood risk, using surveys, simulation and LLM agents.</title><style>text{font-family:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}.fillc{fill:currentColor;stroke:none}.valley .hill{fill:#fff;opacity:.04}.valley .cn{fill:none;stroke:#fff;opacity:.06}
.valley .gr{stroke:#8de4e6;stroke-opacity:.55;stroke-width:1.5}
.valley .wave{fill:#35b6c4;animation:wave 7s linear infinite}.valley .wtr.fr .wave{fill:#8de4e6;opacity:.34}
