<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 509" width="804" height="509"><title>修改中 · Water Resources Research。FLOODABM：家戶面對洪災的選擇，長期下來要付出什麼？把家戶和洪災巨災模型接在一起，將每個選擇一路追到洪水損失、保險理賠和自付金額。這裡的家戶是規則式代理，不是 LLM。我做的部分：設計並發放家戶問卷（紐澤西 Passaic 河流域）；建立把問卷答案轉成代理參數的流程；建立耦合模型，含 NFIP 保費、理賠與自負額機制；第一作者。</title><style>text{font-family:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif,"PingFang TC","Noto Sans TC","Microsoft JhengHei"}.m{font-family:ui-monospace,"SF Mono","Cascadia Mono",Consolas,monospace}.fillc{fill:currentColor;stroke:none}</style><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13444d"/><stop offset=".75" stop-color="#0b2026"/></linearGradient></defs><rect width="804" height="509" rx="28" fill="#8de4e6"/><g opacity=".1"><g transform="translate(584 299) scale(4.791666666666667)" style="color:#06282c" fill="none" stroke="#06282c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 25 24 11l15 14M14 21v12M34 21v12M21 33v-7h6v7"/><path d="M3 38c4-3 6.500-3 10.500 0s6.500 3 10.500 0 6.500-3 10.500 0 6.500 3 10.500 0M3 44c4-3 6.500-3 10.500 0s6.500 3 10.500 0 6.500-3 10.500 0 6.500 3 10.500 0"/></g></g><rect x="32" y="34" width="366" height="38" rx="19" fill="none" stroke="#06282c" stroke-opacity=".28"/><text x="47" y="59" class="m" font-size="17.5" fill="#06282c">修改中 · Water Resources Research</text><text x="32" y="118" font-size="31" font-weight="600" letter-spacing="-1" fill="#06282c">FLOODABM：家戶面對洪災的選擇，長期下來要</text><text x="32" y="155" font-size="31" font-weight="600" letter-spacing="-1" fill="#06282c">付出什麼？</text><text x="32" y="196" font-size="20" fill="#06282c">把家戶和洪災巨災模型接在一起，將每個選擇一路追到洪水損失、保險理賠和</text><text x="32" y="224" font-size="20" fill="#06282c">自付金額。這裡的家戶是規則式代理，不是 LLM。</text><text x="32" y="274" class="m" font-size="17" letter-spacing="1.6" fill="#2a5b60">我做的部分</text><circle cx="39" cy="299" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="306" font-size="19.5" fill="#06282c">設計並發放家戶問卷（紐澤西 Passaic 河流域）</text><circle cx="39" cy="334" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="341" font-size="19.5" fill="#06282c">建立把問卷答案轉成代理參數的流程</text><circle cx="39" cy="369" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="376" font-size="19.5" fill="#06282c">建立耦合模型，含 NFIP 保費、理賠與自負額機制</text><circle cx="39" cy="404" r="4" fill="none" stroke="#06282c" stroke-width="2.2"/><text x="56" y="411" font-size="19.5" fill="#06282c">第一作者</text><text x="772" y="481" text-anchor="end" font-size="20" font-weight="600" fill="#06282c">看案例 ↗</text></svg>