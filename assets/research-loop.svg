<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" role="img" aria-label="Governed LLM agents coupling human behaviour, social interaction, and a living water environment">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="120%">
      <stop offset="0%" stop-color="#0d1422"/>
      <stop offset="60%" stop-color="#0a0e18"/>
      <stop offset="100%" stop-color="#070a11"/>
    </radialGradient>
    <linearGradient id="tealStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glowTeal" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#16203a" stroke-width="0.6" opacity="0.55"/>
    </pattern>
    <clipPath id="envClip"><rect x="715" y="112" width="215" height="178" rx="16"/></clipPath>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#60a5fa"/>
    </marker>
  </defs>

  <!-- ===== background ===== -->
  <rect width="960" height="420" rx="22" fill="url(#bg)"/>
  <rect width="960" height="420" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="958" height="418" rx="21" fill="none" stroke="#1f2a44" stroke-width="1.5"/>

  <!-- drifting data particles -->
  <g fill="#2dd4bf">
    <circle cx="120" cy="90" r="1.6" opacity="0.5">
      <animate attributeName="cy" values="90;70;90" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.15;0.6;0.15" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="860" cy="70" r="1.4" opacity="0.4">
      <animate attributeName="cy" values="70;92;70" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.55;0.1" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="380" r="1.5" fill="#f59e0b" opacity="0.4">
      <animate attributeName="cy" values="380;360;380" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="390" r="1.5" fill="#60a5fa" opacity="0.4">
      <animate attributeName="cy" values="390;368;390" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.5;0.1" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="330" r="1.3" fill="#a78bfa" opacity="0.4">
      <animate attributeName="cy" values="330;310;330" dur="13s" repeatCount="indefinite"/>
    </circle>
    <circle cx="912" cy="320" r="1.3" fill="#a78bfa" opacity="0.4">
      <animate attributeName="cy" values="320;344;320" dur="12s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ===== title ===== -->
  <text x="480" y="40" text-anchor="middle" font-size="25" font-weight="700" fill="url(#titleGrad)">Governed LLM Agents × Human–Environment Systems</text>
  <text x="480" y="63" text-anchor="middle" font-size="12.5" fill="#8b96ad">real behaviour grounds the agent · agents talk to each other · the agent and the environment react to each other</text>

  <!-- ===== LEFT: Real-world behaviour ===== -->
  <g>
    <rect x="30" y="112" width="215" height="178" rx="16" fill="#171209" stroke="#b97c10" stroke-width="1.6"/>
    <rect x="30" y="112" width="215" height="178" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.6" opacity="0.5">
      <animate attributeName="opacity" values="0.25;0.7;0.25" dur="4s" repeatCount="indefinite"/>
    </rect>
    <!-- animated survey bars -->
    <g>
      <rect x="52" y="136" width="7" height="18" rx="2" fill="#f59e0b">
        <animate attributeName="height" values="18;10;18" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="136;144;136" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="62" y="142" width="7" height="12" rx="2" fill="#fbbf24">
        <animate attributeName="height" values="12;20;12" dur="3s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="y" values="142;134;142" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="139" width="7" height="15" rx="2" fill="#f59e0b">
        <animate attributeName="height" values="15;8;15" dur="3s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y" values="139;146;139" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="92" y="150" font-size="14.5" font-weight="700" fill="#fbbf24">Real-World Behaviour</text>
    <text x="137" y="176" text-anchor="middle" font-size="11.5" fill="#d8dee9">household surveys (PMT)</text>
    <text x="137" y="194" text-anchor="middle" font-size="11" fill="#9aa4b8">SEM — how people actually choose</text>
    <rect x="55" y="216" width="165" height="22" rx="11" fill="#241a07" stroke="#f59e0b" stroke-width="0.8" opacity="0.9"/>
    <text x="137" y="231" text-anchor="middle" font-size="10.5" fill="#fbbf24">grounds the agent · one-way</text>
    <text x="137" y="266" text-anchor="middle" font-size="10" fill="#6b7488">calibration only · no outcome peeking</text>
  </g>

  <!-- flow: behaviour -> agent (one-way) -->
  <g>
    <path id="flowGround" d="M248 200 H348" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5 7" marker-end="url(#arrowAmber)" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <rect x="252" y="174" width="94" height="17" rx="8.5" fill="#10131c" stroke="#f59e0b" stroke-width="0.7"/>
    <text x="299" y="186" text-anchor="middle" font-size="9.5" fill="#fbbf24">shapes the agent</text>
    <circle r="3.2" fill="#fbbf24" filter="url(#glowSoft)">
      <animateMotion dur="1.6s" repeatCount="indefinite" path="M248 200 H344"/>
    </circle>
  </g>

  <!-- ===== CENTER: governed LLM agent (the harness) ===== -->
  <g>
    <!-- harness ring -->
    <rect x="358" y="95" width="246" height="240" rx="20" fill="#0c1620"/>
    <rect x="358" y="95" width="246" height="240" rx="20" fill="none" stroke="url(#tealStroke)" stroke-width="2" stroke-dasharray="10 6" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="368" y="88" font-size="9.5" fill="#2dd4bf" letter-spacing="2">AI HARNESS</text>

    <!-- header -->
    <g filter="url(#glowSoft)">
      <rect x="392" y="108" width="20" height="16" rx="4" fill="none" stroke="#2dd4bf" stroke-width="1.6"/>
      <circle cx="398" cy="116" r="1.7" fill="#2dd4bf"/>
      <circle cx="406" cy="116" r="1.7" fill="#2dd4bf">
        <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <line x1="402" y1="108" x2="402" y2="103" stroke="#2dd4bf" stroke-width="1.4"/>
      <circle cx="402" cy="101.5" r="1.6" fill="#2dd4bf"/>
    </g>
    <text x="420" y="121" font-size="15" font-weight="700" fill="#5eead4">LLM Agent</text>
    <text x="481" y="137" text-anchor="middle" font-size="10" fill="#8b96ad">stands in for a real household — governed, auditable</text>

    <!-- step pills -->
    <g font-size="11" fill="#e6edf3">
      <rect x="378" y="146" width="206" height="23" rx="11.5" fill="#0f2a28" stroke="#14b8a6" stroke-width="1"/>
      <text x="481" y="161.5" text-anchor="middle">1 · Perceive — situation &amp; risk</text>

      <rect x="378" y="176" width="206" height="23" rx="11.5" fill="#0f2a28" stroke="#14b8a6" stroke-width="1"/>
      <text x="471" y="191.5" text-anchor="middle">2 · Reason — LLM thinks</text>
      <g fill="#5eead4">
        <circle cx="552" cy="188" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="559" cy="188" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle>
        <circle cx="566" cy="188" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
      </g>

      <rect x="378" y="206" width="206" height="23" rx="11.5" fill="#2a1f08" stroke="#f59e0b" stroke-width="1.2">
        <animate attributeName="stroke-width" values="1.2;2.2;1.2" dur="2s" repeatCount="indefinite"/>
      </rect>
      <text x="481" y="221.5" text-anchor="middle" fill="#fde68a">3 · Verify — is the choice realistic?</text>

      <rect x="378" y="236" width="206" height="23" rx="11.5" fill="#0f2a28" stroke="#14b8a6" stroke-width="1"/>
      <text x="481" y="251.5" text-anchor="middle">4 · Act — decision kept on record</text>
    </g>

    <!-- retry loop -->
    <path d="M584 217 q 14 0 14 -14 v -2 q 0 -14 -14 -14" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 4" opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="14" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <text x="481" y="276" text-anchor="middle" font-size="9.5" fill="#7c8499">↻ rejected? re-think before acting</text>

    <!-- memory strip -->
    <rect x="396" y="288" width="170" height="20" rx="10" fill="#101a2c" stroke="#3b4f78" stroke-width="0.8"/>
    <text x="481" y="301.5" text-anchor="middle" font-size="9.5" fill="#9db1d9">memory · persona · social norms</text>
    <circle cx="402" cy="298" r="2" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- circulating thought tokens on the harness ring -->
    <circle r="3.6" fill="#2dd4bf" filter="url(#glowTeal)">
      <animateMotion dur="8s" repeatCount="indefinite"
        path="M481 95 H584 Q604 95 604 115 V315 Q604 335 584 335 H378 Q358 335 358 315 V115 Q358 95 378 95 Z"/>
    </circle>
    <circle r="2.6" fill="#f59e0b" filter="url(#glowSoft)">
      <animateMotion dur="8s" begin="4s" repeatCount="indefinite"
        path="M481 95 H584 Q604 95 604 115 V315 Q604 335 584 335 H378 Q358 335 358 315 V115 Q358 95 378 95 Z"/>
    </circle>
  </g>

  <!-- ===== RIGHT: environment ===== -->
  <g>
    <rect x="715" y="112" width="215" height="178" rx="16" fill="#0a1426" stroke="#2f5fb3" stroke-width="1.6"/>
    <g clip-path="url(#envClip)">
      <!-- back wave -->
      <path fill="url(#waveB)" d="M715 238 q 27 -14 54 0 t 54 0 t 54 0 t 54 0 t 54 0 t 54 0 V 292 H 715 Z">
        <animateTransform attributeName="transform" type="translate" values="0 0; -108 0; 0 0" dur="9s" repeatCount="indefinite"/>
      </path>
      <!-- front wave -->
      <path fill="url(#waveA)" d="M715 250 q 27 -12 54 0 t 54 0 t 54 0 t 54 0 t 54 0 t 54 0 V 292 H 715 Z">
        <animateTransform attributeName="transform" type="translate" values="-108 0; 0 0; -108 0" dur="6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.95;0.8;0.95" dur="6s" repeatCount="indefinite"/>
      </path>
      <!-- rain ticks -->
      <g stroke="#7db5ff" stroke-width="1" opacity="0.6">
        <line x1="760" y1="150" x2="757" y2="160">
          <animate attributeName="y1" values="142;208" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="152;218" dur="1.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" dur="1.6s" repeatCount="indefinite"/>
        </line>
        <line x1="880" y1="150" x2="877" y2="160">
          <animate attributeName="y1" values="142;208" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="152;218" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" dur="1.9s" begin="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="822" y1="150" x2="819" y2="160">
          <animate attributeName="y1" values="142;208" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="152;218" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0.7;0" dur="1.4s" begin="0.9s" repeatCount="indefinite"/>
        </line>
      </g>
    </g>
    <!-- droplet icon -->
    <path d="M745 126 q 7 9 7 14 a 7 7 0 0 1 -14 0 q 0 -5 7 -14 Z" fill="none" stroke="#7db5ff" stroke-width="1.6" filter="url(#glowSoft)"/>
    <text x="760" y="143" font-size="14.5" font-weight="700" fill="#9cc3ff">Environment</text>
    <text x="822" y="166" text-anchor="middle" font-size="11.5" fill="#d8dee9">living water-system model</text>
    <text x="822" y="184" text-anchor="middle" font-size="10.5" fill="#9aa4b8">flood (CAT) · hydrology · irrigation</text>
    <rect x="752" y="262" width="140" height="20" rx="10" fill="#0b2350" stroke="#3b82f6" stroke-width="0.9"/>
    <text x="822" y="276" text-anchor="middle" font-size="10" fill="#bcd6ff">state · outcomes
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- decision: agent -> environment -->
  <g>
    <path d="M608 162 C 655 146, 668 146, 711 160" fill="none" stroke="#2dd4bf" stroke-width="1.8" stroke-dasharray="5 7" marker-end="url(#arrowTeal)" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <rect x="630" y="131" width="60" height="16" rx="8" fill="#10131c" stroke="#2dd4bf" stroke-width="0.7"/>
    <text x="660" y="142.5" text-anchor="middle" font-size="9.5" fill="#5eead4">decision</text>
    <circle r="3" fill="#5eead4" filter="url(#glowSoft)">
      <animateMotion dur="1.5s" repeatCount="indefinite" path="M608 162 C 655 146, 668 146, 708 159"/>
    </circle>
  </g>

  <!-- feedback: environment -> agent -->
  <g>
    <path d="M711 248 C 668 264, 655 264, 611 250" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-dasharray="5 7" marker-end="url(#arrowBlue)" opacity="0.9">
      <animate attributeName="stroke-dashoffset" from="48" to="0" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <rect x="608" y="268" width="104" height="16" rx="8" fill="#10131c" stroke="#60a5fa" stroke-width="0.7"/>
    <text x="660" y="279.5" text-anchor="middle" font-size="9.5" fill="#9cc3ff">what happens next</text>
    <circle r="3" fill="#9cc3ff" filter="url(#glowSoft)">
      <animateMotion dur="1.8s" repeatCount="indefinite" path="M711 248 C 668 264, 655 264, 614 250"/>
    </circle>
  </g>

  <!-- ===== SOCIAL LAYER: multi-agent interaction ===== -->
  <g>
    <!-- links from main agent down to neighbours -->
    <path d="M455 335 L415 372" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M481 335 L481 384" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="0" to="16" dur="1.6s" repeatCount="indefinite"/>
    </path>
    <path d="M507 335 L547 372" stroke="#a78bfa" stroke-width="1.2" stroke-dasharray="3 5" opacity="0.7">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1.9s" repeatCount="indefinite"/>
    </path>
    <!-- neighbour-to-neighbour gossip -->
    <path d="M424 378 H470" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 4" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="12" to="0" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M492 378 H538" stroke="#a78bfa" stroke-width="1" stroke-dasharray="2 4" opacity="0.55">
      <animate attributeName="stroke-dashoffset" from="0" to="12" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- neighbour agents -->
    <g stroke="#a78bfa" stroke-width="1.4" fill="#141026">
      <circle cx="415" cy="378" r="9">
        <animate attributeName="r" values="9;10;9" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="481" cy="392" r="9">
        <animate attributeName="r" values="9;10;9" dur="2.6s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="547" cy="378" r="9">
        <animate attributeName="r" values="9;10;9" dur="2.6s" begin="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>
    <g fill="#c4b5fd" font-size="8.5" text-anchor="middle">
      <text x="415" y="381.5">A₂</text>
      <text x="481" y="395.5">A₃</text>
      <text x="547" y="381.5">A₄</text>
    </g>
    <!-- gossip packets -->
    <circle r="2.2" fill="#c4b5fd" filter="url(#glowSoft)">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M424 378 H470"/>
    </circle>
    <circle r="2.2" fill="#c4b5fd" filter="url(#glowSoft)">
      <animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M538 378 H492"/>
    </circle>
    <text x="481" y="414" text-anchor="middle" font-size="10" fill="#8a7fb8">social interaction — agents exchange signals, norms spread through the network</text>
  </g>

  <!-- corner tag -->
  <text x="930" y="408" text-anchor="end" font-size="9" fill="#3d4760">perceive → reason → verify → act · repeat</text>
</svg>
